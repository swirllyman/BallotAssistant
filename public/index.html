<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>U.S. Ballot Assistant</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f6f8;
      --surface: #ffffff;
      --surface-2: #f1f3f6;
      --border: #e2e5ea;
      --border-strong: #c9ced6;
      --text: #111827;
      --text-muted: #4b5563;
      --text-dim: #6b7280;
      --accent: #1d4ed8;
      --accent-hover: #1e40af;
      --accent-soft: #eef3ff;
      --on-accent: #ffffff;
      --success: #15803d;
      --success-soft: #ecfdf3;
      --success-border: #a7e3bd;
      --warning: #92400e;
      --warning-soft: #fffaeb;
      --warning-border: #f5d48b;
      --party-dem: #2563eb;
      --party-rep: #dc2626;
      --party-other: #7c3aed;
      --focus: #2563eb;
      --shadow: 0 1px 2px rgba(16, 24, 40, 0.05);
      --shadow-raised: 0 8px 24px rgba(16, 24, 40, 0.12);
      --radius: 12px;
      --radius-sm: 8px;
      --font: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;

      /* Older names still read by css/a11y.css. */
      --card-bg: var(--surface);
      --card-border: var(--border);
      --text-main: var(--text);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #0f1115;
        --surface: #171a21;
        --surface-2: #1f232c;
        --border: #2a2f3a;
        --border-strong: #3b414d;
        --text: #e8eaee;
        --text-muted: #a6acb8;
        --text-dim: #8a909c;
        --accent: #7aa7ff;
        --accent-hover: #9dbeff;
        --accent-soft: rgba(122, 167, 255, 0.12);
        --on-accent: #0b1220;
        --success: #4ade80;
        --success-soft: rgba(74, 222, 128, 0.08);
        --success-border: rgba(74, 222, 128, 0.3);
        --warning: #fbbf24;
        --warning-soft: rgba(251, 191, 36, 0.07);
        --warning-border: rgba(251, 191, 36, 0.3);
        --party-dem: #6b9bff;
        --party-rep: #ff7a7a;
        --party-other: #b794f6;
        --focus: #7aa7ff;
        --shadow: none;
        --shadow-raised: 0 8px 24px rgba(0, 0, 0, 0.5);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: var(--accent);
    }

    :focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .container {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 1.25rem 4rem;
    }

    /* Top bar: app name on the left, language and read-aloud on the right */
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem 1.5rem;
      padding: 1rem 0;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    header.brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-width: 0;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      background: var(--accent);
      color: var(--on-accent);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.3;
    }

    p.subtitle {
      color: var(--text-dim);
      font-size: 0.85rem;
      line-height: 1.35;
    }

    #a11y-slot {
      margin-left: auto;
    }

    /* App layout: race list + content */
    .app-layout {
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
      gap: 2rem;
      align-items: start;
    }

    .app-layout.single-column {
      display: block;
    }

    .main-content {
      min-width: 0;
      max-width: 780px;
    }

    .app-layout.single-column .main-content {
      margin: 0 auto;
      max-width: 560px;
    }

    .sidebar-panel,
    .mobile-nav-toggle,
    .stepper-header,
    .progress-bar-container,
    .ballot-context {
      display: none;
    }

    body.ballot-mode .sidebar-panel {
      display: flex;
    }

    body.ballot-mode .stepper-header,
    body.ballot-mode .ballot-context {
      display: flex;
    }

    body.ballot-mode .progress-bar-container {
      display: block;
    }

    /* Race list */
    .sidebar-panel {
      position: sticky;
      top: 1.25rem;
      flex-direction: column;
      gap: 0.75rem;
      max-height: calc(100vh - 2.5rem);
      overflow-y: auto;
      z-index: 100;
    }

    .sidebar-title-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 0 0.5rem;
    }

    .sidebar-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .sidebar-counter {
      font-size: 0.8rem;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .nav-group {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.85rem 0.5rem 0.3rem;
    }

    .nav-group:first-child {
      padding-top: 0.25rem;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      width: 100%;
      padding: 0.5rem;
      border-radius: var(--radius-sm);
      background: transparent;
      border: none;
      color: var(--text-muted);
      font: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      text-align: start;
      cursor: pointer;
    }

    .nav-item:hover {
      background: var(--surface-2);
      color: var(--text);
    }

    .nav-item.active {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }

    .nav-item.nav-summary {
      margin-top: 0.5rem;
      border-top: 1px solid var(--border);
      border-radius: 0 0 var(--radius-sm) var(--radius-sm);
      padding-top: 0.75rem;
    }

    .nav-status-icon {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1.5px solid var(--border-strong);
      display: grid;
      place-items: center;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-dim);
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    .nav-item.active .nav-status-icon {
      border-color: var(--accent);
      color: var(--accent);
    }

    .nav-item.answered .nav-status-icon {
      background: var(--success);
      border-color: var(--success);
      color: var(--surface);
    }

    .nav-label {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-grow: 1;
    }

    .back-home-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      font: inherit;
      font-size: 0.85rem;
      padding: 0.5rem;
      text-align: start;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .back-home-btn:hover {
      color: var(--text);
    }

    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 17, 21, 0.45);
      z-index: 90;
    }

    .mobile-nav-toggle {
      width: 100%;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.7rem 0.9rem;
      border-radius: var(--radius);
      font: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 1rem;
      cursor: pointer;
      box-shadow: var(--shadow);
    }

    .sidebar-counter,
    .mobile-counter-badge {
      direction: ltr;
      unicode-bidi: isolate;
    }

    .mobile-counter-badge {
      color: var(--text-dim);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 860px) {
      .app-layout {
        display: block;
      }

      body.ballot-mode .mobile-nav-toggle {
        display: flex;
      }

      .sidebar-panel {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        width: min(300px, 85vw);
        max-height: none;
        padding: 1.25rem 0.75rem;
        background: var(--surface);
        border-right: 1px solid var(--border);
        box-shadow: var(--shadow-raised);
        transform: translateX(-105%);
        transition: transform 0.2s ease;
      }

      [dir="rtl"] .sidebar-panel {
        left: auto;
        right: 0;
        transform: translateX(105%);
      }

      .sidebar-panel.open,
      [dir="rtl"] .sidebar-panel.open {
        transform: none;
      }

      .sidebar-backdrop.active {
        display: block;
      }
    }

    /* Where the guide is for, shown once above the race */
    .ballot-context {
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem 1rem;
      margin-bottom: 1.25rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .location-info strong {
      color: var(--text);
      font-weight: 600;
    }

    .change-loc-btn {
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--accent);
      cursor: pointer;
    }

    .change-loc-btn:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    #ballot-notice:empty {
      display: none;
    }

    /* Progress */
    .stepper-header {
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      margin-bottom: 0.5rem;
      color: var(--text-dim);
      font-size: 0.85rem;
      font-weight: 500;
    }

    .progress-bar-container {
      width: 100%;
      height: 4px;
      background: var(--border);
      border-radius: 9999px;
      overflow: hidden;
      margin-bottom: 1.25rem;
    }

    .progress-bar {
      height: 100%;
      background: var(--accent);
      width: 0;
      transition: width 0.3s ease;
    }

    /* Cards */
    .step-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      box-shadow: var(--shadow);
      display: none;
    }

    .step-card.active {
      display: block;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .step-card.active { animation: none; }
      .progress-bar, .sidebar-panel { transition: none; }
    }

    /* Address screen */
    .address-card h2 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
    }

    .address-card .lead {
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    .input-group {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 9rem;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    @media (max-width: 520px) {
      .input-group {
        grid-template-columns: 1fr;
      }
    }

    label {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.35rem;
    }

    .label-hint {
      font-weight: 400;
      color: var(--text-dim);
    }

    input[type="text"] {
      width: 100%;
      padding: 0.7rem 0.85rem;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      color: var(--text);
      font: inherit;
      font-size: 1rem;
    }

    input[type="text"]::placeholder {
      color: var(--text-dim);
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .example-row {
      margin-top: 1rem;
      font-size: 0.875rem;
      color: var(--text-dim);
      text-align: center;
    }

    .chip {
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      color: var(--accent);
      font-weight: 500;
      cursor: pointer;
    }

    .chip:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* Callouts */
    .election-notice {
      background: var(--warning-soft);
      border: 1px solid var(--warning-border);
      color: var(--text);
      border-radius: var(--radius-sm);
      padding: 0.75rem 0.9rem;
      margin-bottom: 1.25rem;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .election-notice.info {
      background: var(--surface-2);
      border-color: var(--border);
    }

    .election-notice a {
      color: var(--accent);
      font-weight: 500;
    }

    .ballot-context + #ballot-notice .election-notice {
      margin-bottom: 1.25rem;
    }

    /* Race */
    .race-type {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.35rem;
    }

    .race-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.25;
      margin-bottom: 1rem;
    }

    .overview-box {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.65;
      padding-bottom: 1.5rem;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .overview-box h4 {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.35rem;
    }

    .overview-box p {
      margin-top: 0.6rem;
    }

    .source-link-row,
    .candidate-sources {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem 1.25rem;
      margin-top: 0.75rem;
    }

    .source-link {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--accent);
      text-decoration: none;
    }

    .source-link:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .source-link svg {
      flex-shrink: 0;
    }

    /* Candidates */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .options-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .candidate-card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      padding: 1rem 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 0.85rem;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .candidate-card:hover {
      border-color: var(--accent);
    }

    .candidate-card.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
      background: var(--accent-soft);
    }

    .radio-circle {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1.5px solid var(--border-strong);
      background: var(--surface);
      margin-top: 0.2rem;
      flex-shrink: 0;
      display: grid;
      place-items: center;
    }

    .candidate-card.selected .radio-circle {
      border-color: var(--accent);
      background: var(--accent);
    }

    .radio-circle::after {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--on-accent);
      opacity: 0;
    }

    .candidate-card.selected .radio-circle::after {
      opacity: 1;
    }

    .candidate-info {
      flex-grow: 1;
      min-width: 0;
    }

    .candidate-header {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.25rem 0.75rem;
      margin-bottom: 0.25rem;
    }

    .candidate-name {
      font-weight: 600;
      font-size: 1.05rem;
    }

    .party-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .party-tag::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-dim);
      flex-shrink: 0;
    }

    .party-tag.party-dem::before { background: var(--party-dem); }
    .party-tag.party-rep::before { background: var(--party-rep); }
    .party-tag.party-non::before { background: var(--party-other); }

    .candidate-header .a11y-say {
      margin-inline-start: auto;
    }

    .candidate-desc {
      color: var(--text-muted);
      font-size: 0.925rem;
      line-height: 1.6;
    }

    /* Strengths and considerations, folded away until asked for */
    .pros-cons-details {
      margin-top: 0.75rem;
    }

    .pros-cons-details > summary {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--accent);
      cursor: pointer;
      list-style: none;
    }

    .pros-cons-details > summary::-webkit-details-marker {
      display: none;
    }

    .pros-cons-details > summary svg {
      transition: transform 0.15s ease;
    }

    .pros-cons-details[open] > summary svg {
      transform: rotate(90deg);
    }

    [dir="rtl"] .pros-cons-details > summary svg {
      transform: scaleX(-1);
    }

    [dir="rtl"] .pros-cons-details[open] > summary svg {
      transform: rotate(90deg);
    }

    .pros-cons-container {
      margin-top: 0.75rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }

    @media (max-width: 600px) {
      .pros-cons-container {
        grid-template-columns: 1fr;
        gap: 1rem;
      }
    }

    .pros-title,
    .cons-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.4rem;
    }

    .pro-con-ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .pro-con-ul li {
      font-size: 0.875rem;
      color: var(--text-muted);
      line-height: 1.5;
      position: relative;
      padding-left: 1rem;
    }

    .pro-con-ul li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0.6em;
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .pro-con-ul.pros-ul li::before { background: var(--success); }
    .pro-con-ul.cons-ul li::before { background: var(--warning); }

    /* Buttons */
    button {
      font: inherit;
      cursor: pointer;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.65rem 1.15rem;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-weight: 600;
      border: 1px solid transparent;
      transition: background-color 0.15s ease, border-color 0.15s ease;
      text-decoration: none;
    }

    .btn-primary,
    .btn-next,
    .btn-submit-address,
    .copy-btn {
      background: var(--accent);
      color: var(--on-accent);
    }

    .btn-primary:hover,
    .btn-next:hover,
    .btn-submit-address:hover,
    .copy-btn:hover {
      background: var(--accent-hover);
    }

    .btn-prev,
    .btn-secondary {
      background: var(--surface);
      border-color: var(--border-strong);
      color: var(--text);
    }

    .btn-prev:hover,
    .btn-secondary:hover {
      background: var(--surface-2);
    }

    .btn-submit-address {
      width: 100%;
      padding: 0.8rem 1.15rem;
      font-size: 1rem;
    }

    .btn-group {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
    }

    /* Keep Previous/Next in reach while scrolling a long race */
    .race-nav {
      position: sticky;
      bottom: 0;
      margin: 0 -2rem -2rem;
      padding: 1rem 2rem;
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-radius: 0 0 var(--radius) var(--radius);
    }

    .btn-next {
      margin-inline-start: auto;
    }

    @media (max-width: 600px) {
      .container {
        padding: 0 1rem 3rem;
      }

      .topbar {
        margin-bottom: 1rem;
      }

      .step-card {
        padding: 1.25rem;
      }

      .race-nav {
        margin: 0 -1.25rem -1.25rem;
        padding: 0.75rem 1.25rem;
      }

      .race-nav .btn {
        flex: 1;
      }

      .race-title {
        font-size: 1.3rem;
      }
    }

    /* Voting plan recap */
    .summary-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.25rem 1.1rem;
      margin-bottom: 1.5rem;
    }

    .recap-hero {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    .recap-hero .race-title {
      margin-bottom: 0.25rem;
    }

    .recap-badge {
      color: var(--success);
    }

    .recap-location {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .recap-countdown {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.6rem 1rem;
      text-align: center;
      min-width: 140px;
    }

    .recap-countdown-number {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .recap-countdown-label {
      font-size: 0.78rem;
      color: var(--text-dim);
    }

    .recap-plain {
      background: var(--success-soft);
      border: 1px solid var(--success-border);
      border-radius: var(--radius-sm);
      padding: 0.85rem 1rem;
      color: var(--text);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }

    .recap-plain.incomplete {
      background: var(--warning-soft);
      border-color: var(--warning-border);
    }

    .recap-section-title {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text);
      margin: 0 0 0.6rem;
    }

    .recap-group-title {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.9rem 0 0.1rem;
    }

    .recap-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.75rem;
      align-items: center;
      padding: 0.7rem 0;
      border-bottom: 1px solid var(--border);
    }

    .recap-row:last-child {
      border-bottom: none;
    }

    .recap-race-title {
      color: var(--text-dim);
      font-size: 0.85rem;
      margin-bottom: 0.1rem;
    }

    .recap-choice {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.25rem 0.75rem;
      font-weight: 600;
    }

    .recap-choice.skipped {
      color: var(--warning);
      font-weight: 500;
    }

    .recap-edit-btn {
      background: none;
      border: none;
      color: var(--accent);
      padding: 0.25rem 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      border-radius: 6px;
    }

    .recap-edit-btn:hover {
      background: var(--accent-soft);
    }

    .recap-steps {
      list-style: none;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      counter-reset: recap-step;
    }

    .recap-step {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.9rem 1rem;
      counter-increment: recap-step;
    }

    .recap-step-title {
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 0.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .recap-step-title::before {
      content: counter(recap-step);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--surface-2);
      color: var(--text-muted);
      display: grid;
      place-items: center;
      font-size: 0.75rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .recap-step p {
      color: var(--text-muted);
      font-size: 0.875rem;
      line-height: 1.55;
    }

    .recap-disclaimer {
      color: var(--text-dim);
      font-size: 0.8rem;
      line-height: 1.5;
      margin-bottom: 1.25rem;
    }

    .recap-actions {
      flex-wrap: wrap;
      justify-content: flex-start;
      align-items: center;
    }

    .recap-actions .back-home-btn {
      margin-inline-start: auto;
    }

    .copy-btn.copied {
      background: var(--success);
    }

    @media (max-width: 600px) {
      .recap-steps {
        grid-template-columns: 1fr;
      }
      .recap-actions .btn {
        flex: 1 1 100%;
      }
      .recap-actions .back-home-btn {
        margin: 0 auto;
      }
    }

    @media print {
      :root {
        --bg: #ffffff;
        --surface: #ffffff;
        --text: #000000;
        --text-muted: #222222;
        --text-dim: #444444;
        --border: #cccccc;
      }
      body {
        background: #ffffff !important;
        color: #000000 !important;
      }
      .topbar, .sidebar-panel, .sidebar-backdrop, .mobile-nav-toggle, .ballot-context, #ballot-notice,
      .stepper-header, .progress-bar-container, .recap-actions, .recap-edit-btn, .a11y-say, .a11y-player {
        display: none !important;
      }
      .app-layout {
        display: block !important;
      }
      .main-content {
        max-width: none;
      }
      .step-card {
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
      }
      .recap-row, .recap-step {
        break-inside: avoid;
      }
    }
  </style>
  <link rel="stylesheet" href="./css/a11y.css">
</head>
<body>

  <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="toggleMobileSidebar()"></div>

  <div class="container">
    <div class="topbar">
      <header class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>
        </div>
        <div>
          <h1 id="app-main-title">U.S. Ballot Assistant</h1>
          <p class="subtitle" id="app-sub-title">2026 U.S. General Election • Tuesday, November 3, 2026</p>
        </div>
      </header>
      <div id="a11y-slot"></div>
    </div>

    <div class="app-layout single-column" id="app-layout">
      <!-- Race list, filled in when a ballot loads -->
      <aside class="sidebar-panel" id="sidebar-panel" aria-label="Your ballot">
        <div class="sidebar-title-row">
          <span class="sidebar-title">Your ballot</span>
          <span class="sidebar-counter" id="answered-counter">0 / 0</span>
        </div>

        <nav class="nav-list" id="dynamic-nav-list"></nav>

        <button class="back-home-btn" onclick="resetToAddressScreen()">Change Address</button>
      </aside>

      <main class="main-content">
        <button class="mobile-nav-toggle" id="mobile-toggle-btn" onclick="toggleMobileSidebar()">
          <span>Your ballot</span>
          <span class="mobile-counter-badge" id="mobile-counter-badge">0 / 0</span>
        </button>

        <div class="ballot-context" id="ballot-context">
          <div class="location-info" id="location-info"></div>
          <button class="change-loc-btn" onclick="resetToAddressScreen()">Change Address</button>
        </div>
        <div id="ballot-notice"></div>

        <div class="stepper-header" id="stepper-header">
          <span id="step-indicator">Step 1 of 5</span>
          <span id="step-category">Federal Office</span>
        </div>

        <div class="progress-bar-container" id="progress-bar-container">
          <div class="progress-bar" id="progress-bar"></div>
        </div>

        <!-- STEP 0: ADDRESS -->
        <div class="step-card address-card active" id="step-0">
          <h2>Find your ballot guide</h2>
          <p class="lead">Enter your street address and 5-digit ZIP code to see the contests, candidates and measures on your ballot.</p>

          <div class="election-notice" id="lookup-message" role="status" style="display: none;"></div>

          <form onsubmit="handleAddressLookup(event)">
            <div class="input-group">
              <div>
                <label for="input-address"><span>Street address or city</span></label>
                <input type="text" id="input-address" placeholder="e.g. 4500 SW Alaska St, Seattle WA" autocomplete="street-address">
              </div>
              <div>
                <label for="input-zip"><span>ZIP code</span></label>
                <input type="text" id="input-zip" placeholder="e.g. 98116" inputmode="numeric" maxlength="5" autocomplete="postal-code">
              </div>
            </div>

            <div class="election-notice info" id="election-day-notice"></div>

            <button type="submit" class="btn btn-submit-address" id="btn-submit-main">Find my ballot</button>
          </form>

          <p class="example-row">
            <span>Try an example</span>:
            <button type="button" class="chip" onclick="setPreset('Seattle WA', '98116')">Seattle, WA 98116</button>
          </p>
        </div>

        <div id="dynamic-step-cards-container"></div>
      </main>
    </div>
  </div>

  <script src="./js/config.js"></script>
  <script src="./js/civic.js"></script>
  <script>
    let activeDistrictData = null;
    let currentStep = 0;
    let selections = {};

    const CONFIG = window.BALLOT_CONFIG || {};
    const UPCOMING_ELECTION = CONFIG.upcomingElection || { name: '2026 U.S. General Election', date: '2026-11-03' };

    const OFFICIAL_LOOKUP_HTML = `Check your registration and see your official sample ballot at
      <a href="https://vote.gov" target="_blank" rel="noopener">vote.gov</a> or
      <a href="https://www.vote411.org/ballot" target="_blank" rel="noopener">Vote411</a>.`;

    function escapeHTML(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[ch]);
    }

    // Only allow http(s) links from data and API responses.
    function safeUrl(url) {
      return /^https?:\/\//i.test(url || '') ? url : '';
    }

    function formatElectionDate(isoDate) {
      const [y, m, d] = isoDate.split('-').map(Number);
      return new Date(y, m - 1, d).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    }

    function isPastDate(isoDate) {
      const [y, m, d] = isoDate.split('-').map(Number);
      const endOfDay = new Date(y, m - 1, d, 23, 59, 59);
      return endOfDay < new Date();
    }

    function showLookupMessage(html) {
      const el = document.getElementById('lookup-message');
      el.innerHTML = html;
      el.style.display = html ? 'block' : 'none';
    }

    // Only ZIP files tagged with the election they cover are treated as real ballot
    // guides. Older generated placeholder files have no "election" metadata.
    async function loadDistrictByZip(zipCode) {
      try {
        const res = await fetch(`./data/zips/${zipCode}.json`);
        if (res.ok) {
          const data = await res.json();
          if (data && data.election && data.election.date) return data;
        }
      } catch (e) {}
      return null;
    }

    async function setPreset(neighborhood, zip) {
      document.getElementById('input-address').value = '';
      document.getElementById('input-zip').value = zip;
      
      const data = await loadDistrictByZip(zip);
      if (data) {
        showLookupMessage('');
        activeDistrictData = data;
        renderDistrictData();
      }
    }

    async function handleAddressLookup(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-submit-main');
      btn.textContent = 'Finding your ballot…';
      btn.disabled = true;

      const rawAddress = document.getElementById('input-address').value.trim();
      const rawZip = document.getElementById('input-zip').value.trim();

      const zipMatch = (rawZip + " " + rawAddress).match(/\b\d{5}\b/);
      if (!zipMatch) {
        btn.textContent = 'Find my ballot';
        btn.disabled = false;
        showLookupMessage('Please enter a 5-digit ZIP code.');
        return;
      }

      let data = null;
      let civicError = null;
      if (CONFIG.civicApiKey && window.CivicBallot) {
        const fullAddress = [rawAddress, rawZip].filter(Boolean).join(' ');
        try {
          data = await window.CivicBallot.fetchCivicBallot(fullAddress, CONFIG.civicApiKey);
        } catch (err) {
          civicError = err;
        }
      }

      // Hand-curated guides are only a fallback when the live lookup has nothing.
      if (!data && (!civicError || civicError.kind !== 'address')) {
        data = await loadDistrictByZip(zipMatch[0]);
      }
      btn.textContent = 'Find my ballot';
      btn.disabled = false;

      // Never substitute another area's ballot for an address we don't cover.
      if (!data) {
        const reason = civicError ? escapeHTML(civicError.message) : `We don't have a verified ballot guide for ZIP ${escapeHTML(zipMatch[0])} yet.`;
        const hint = civicError && civicError.kind === 'address' ? ' Please include your street address and ZIP code.' : '';
        showLookupMessage(`${reason}${hint} ${OFFICIAL_LOOKUP_HTML}`);
        return;
      }

      showLookupMessage('');
      activeDistrictData = data;
      renderDistrictData();
    }

    const ICON_EXTERNAL = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>';
    const ICON_CHEVRON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';

    // Some data labels start with an emoji ("🔗 Ballotpedia"); the link icon already says it is a link.
    function stripLeadingEmoji(text) {
      return String(text ?? '').replace(/^[\p{Extended_Pictographic}\uFE0F\u200D\s]+/u, '');
    }

    function renderDistrictData() {
      if (!activeDistrictData) return;

      const addr = document.getElementById('input-address').value.trim() || activeDistrictData.locationName;
      const zip = document.getElementById('input-zip').value.trim() || "";
      
      const election = activeDistrictData.election;
      const electionDateText = formatElectionDate(election.date);
      document.getElementById('app-main-title').textContent = `${activeDistrictData.state} Ballot Assistant`;
      document.getElementById('app-sub-title').textContent = `${election.name} • ${electionDateText}`;

      // Where this guide is for, shown once above the races.
      document.getElementById('location-info').innerHTML =
        `<strong>${escapeHTML(addr)}${zip ? ' ' + escapeHTML(zip) : ''}</strong> • <span>${escapeHTML(activeDistrictData.districtText.replace(/\s*\|\s*/g, ' • '))}</span>`;

      let electionNoticeHTML = '';
      if (isPastDate(election.date)) {
        electionNoticeHTML = `<div class="election-notice">This guide covers the <strong>${escapeHTML(election.name)}</strong> (${escapeHTML(electionDateText)}), which has already happened. It has not been updated for the ${escapeHTML(UPCOMING_ELECTION.name)} on ${escapeHTML(formatElectionDate(UPCOMING_ELECTION.date))}, so candidates and measures on your ballot may differ. ${OFFICIAL_LOOKUP_HTML}</div>`;
      }
      document.getElementById('ballot-notice').innerHTML = electionNoticeHTML;

      const info = activeDistrictData.votingInfo;
      let votingInfoHTML = '';
      if (info) {
        const links = [
          [info.ballotInfoUrl, 'Official sample ballot'],
          [info.registrationUrl, 'Check registration'],
          [info.electionInfoUrl, 'State election office']
        ].filter(([url]) => safeUrl(url))
          .map(([url, label]) => `<a href="${escapeHTML(safeUrl(url))}" target="_blank" rel="noopener">${label}</a>`)
          .join(' • ');
        const where = info.pollingLocation
          ? `<strong>Your polling place:</strong> ${escapeHTML(info.pollingLocation)}${info.pollingHours ? ' (' + escapeHTML(info.pollingHours) + ')' : ''}.`
          : '';
        const extras = [info.hasEarlyVoting ? 'Early voting sites are available.' : '', info.hasDropOff ? 'Ballot drop boxes are available.' : ''].filter(Boolean).join(' ');
        if (where || extras || links) {
          votingInfoHTML = `<div class="election-notice info">${[where, extras, links].filter(Boolean).join(' ')}</div>`;
        }
      }

      selections = {};

      // 1. Build the race list, grouped by category in ballot order
      const navList = document.getElementById('dynamic-nav-list');
      navList.innerHTML = '';

      let lastCategory = null;
      activeDistrictData.races.forEach((race, idx) => {
        const stepNum = idx + 1;
        if (race.category && race.category !== lastCategory) {
          lastCategory = race.category;
          const group = document.createElement('div');
          group.className = 'nav-group';
          group.textContent = race.category;
          navList.appendChild(group);
        }
        const navItem = document.createElement('button');
        navItem.type = 'button';
        navItem.className = 'nav-item';
        navItem.id = `nav-${stepNum}`;
        navItem.dataset.num = stepNum;
        navItem.onclick = () => goToStep(stepNum);
        navItem.innerHTML = `
          <span class="nav-status-icon" aria-hidden="true">${stepNum}</span>
          <span class="nav-label">${escapeHTML(race.shortTitle)}</span>
        `;
        navList.appendChild(navItem);
      });

      const sumStepNum = activeDistrictData.races.length + 1;
      const sumNavItem = document.createElement('button');
      sumNavItem.type = 'button';
      sumNavItem.className = 'nav-item nav-summary';
      sumNavItem.id = `nav-${sumStepNum}`;
      sumNavItem.onclick = () => goToStep(sumStepNum);
      sumNavItem.innerHTML = `
        <span class="nav-status-icon" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg></span>
        <span class="nav-label">Your Voting Plan</span>
      `;
      navList.appendChild(sumNavItem);

      // 2. Build Step Cards
      const stepCardsContainer = document.getElementById('dynamic-step-cards-container');
      stepCardsContainer.innerHTML = '';

      activeDistrictData.races.forEach((race, idx) => {
        const stepNum = idx + 1;
        const card = document.createElement('div');
        card.className = 'step-card';
        card.setAttribute('data-step', stepNum);

        let sourcesHTML = '';
        if (race.sources && race.sources.length) {
          sourcesHTML = `<div class="source-link-row">` + race.sources.filter(s => safeUrl(s.url)).map(s => `<a class="source-link" href="${escapeHTML(safeUrl(s.url))}" target="_blank" rel="noopener">${escapeHTML(stripLeadingEmoji(s.label))}${ICON_EXTERNAL}</a>`).join(' ') + `</div>`;
        }

        let candidatesHTML = race.candidates.map((c, candIdx) => {
          let prosHTML = '';
          if (c.pros && c.pros.length) {
            prosHTML = `<div class="pros-box"><div class="pros-title">Key Strengths</div><ul class="pro-con-ul pros-ul">` + c.pros.map(p => `<li>${escapeHTML(p)}</li>`).join('') + `</ul></div>`;
          }

          let consHTML = '';
          if (c.cons && c.cons.length) {
            consHTML = `<div class="cons-box"><div class="cons-title">Key Considerations</div><ul class="pro-con-ul cons-ul">` + c.cons.map(cn => `<li>${escapeHTML(cn)}</li>`).join('') + `</ul></div>`;
          }

          let prosConsGridHTML = '';
          if (prosHTML || consHTML) {
            prosConsGridHTML = `
              <details class="pros-cons-details" onclick="event.stopPropagation()">
                <summary>${ICON_CHEVRON}<span>Strengths and considerations</span></summary>
                <div class="pros-cons-container">${prosHTML}${consHTML}</div>
              </details>`;
          }

          const siteHTML = safeUrl(c.site)
            ? `<div class="candidate-sources"><a class="source-link" href="${escapeHTML(safeUrl(c.site))}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Candidate Website${ICON_EXTERNAL}</a></div>`
            : '';

          return `
            <div class="candidate-card" data-cand-index="${candIdx}" role="radio" aria-checked="false" tabindex="0"
                 onclick="selectCandidate(${stepNum}, ${candIdx})"
                 onkeydown="if ((event.key === 'Enter' || event.key === ' ') && event.target === this) { event.preventDefault(); selectCandidate(${stepNum}, ${candIdx}); }">
              <div class="radio-circle" aria-hidden="true"></div>
              <div class="candidate-info">
                <div class="candidate-header">
                  <span class="candidate-name">${escapeHTML(c.name)}</span>
                  ${c.party && c.party !== 'Measure Response' ? `<span class="party-tag ${escapeHTML(c.partyClass)}">${escapeHTML(c.party)}</span>` : ''}
                </div>
                ${c.desc ? `<p class="candidate-desc">${escapeHTML(c.desc)}</p>` : ''}
                ${prosConsGridHTML}
                ${siteHTML}
              </div>
            </div>
          `;
        }).join('');

        card.innerHTML = `
          ${stepNum === 1 ? votingInfoHTML : ''}
          <div class="race-type">${escapeHTML(race.type)}</div>
          <h2 class="race-title">${escapeHTML(race.title)}</h2>
          
          ${race.overview || sourcesHTML || race.details ? `<div class="overview-box">
            <h4>${race.category === 'Ballot Measure' ? 'About This Measure' : 'Race & Office Overview'}</h4>
            ${escapeHTML(race.overview)}
            ${race.details && race.details.pro ? `<p><strong>Argument for:</strong> ${escapeHTML(race.details.pro)}</p>` : ''}
            ${race.details && race.details.con ? `<p><strong>Argument against:</strong> ${escapeHTML(race.details.con)}</p>` : ''}
            ${sourcesHTML}
          </div>` : ''}

          <div class="options-grid" role="radiogroup" aria-label="${escapeHTML(race.title)}">
            ${candidatesHTML}
          </div>

          <div class="btn-group race-nav">
            ${stepNum > 1 ? `<button class="btn btn-prev" onclick="prevStep(${stepNum})">← Previous</button>` : '<div></div>'}
            <button class="btn btn-next" onclick="nextStep(${stepNum})">${stepNum === activeDistrictData.races.length ? 'View Summary →' : 'Next Race →'}</button>
          </div>
        `;

        stepCardsContainer.appendChild(card);
      });

      // 3. Build Summary Card (filled in by renderRecap when shown)
      const summaryCard = document.createElement('div');
      summaryCard.className = 'step-card';
      summaryCard.id = 'summary-card';

      stepCardsContainer.appendChild(summaryCard);

      document.getElementById('app-layout').classList.remove('single-column');
      document.getElementById('step-0').classList.remove('active');
      document.body.classList.add('ballot-mode');

      goToStep(1);
    }

    function resetToAddressScreen() {
      document.querySelectorAll('.step-card').forEach(el => el.classList.remove('active'));
      document.getElementById('app-layout').classList.add('single-column');
      document.body.classList.remove('ballot-mode');
      document.getElementById('step-0').classList.add('active');
      currentStep = 0;
      closeMobileSidebar();
      window.scrollTo(0, 0);
    }

    function toggleMobileSidebar() {
      const panel = document.getElementById('sidebar-panel');
      const backdrop = document.getElementById('sidebar-backdrop');
      panel.classList.toggle('open');
      backdrop.classList.toggle('active');
    }

    function closeMobileSidebar() {
      const panel = document.getElementById('sidebar-panel');
      const backdrop = document.getElementById('sidebar-backdrop');
      panel.classList.remove('open');
      backdrop.classList.remove('active');
    }

    function updateSidebarStatus() {
      if (!activeDistrictData) return;
      const totalRaces = activeDistrictData.races.length;
      let answeredCount = 0;

      for (let i = 1; i <= totalRaces; i++) {
        const navEl = document.getElementById(`nav-${i}`);
        if (!navEl) continue;

        if (selections[i]) {
          navEl.classList.add('answered');
          navEl.querySelector('.nav-status-icon').textContent = '✓';
          answeredCount++;
        } else {
          navEl.classList.remove('answered');
          navEl.querySelector('.nav-status-icon').textContent = navEl.dataset.num;
        }

        navEl.classList.toggle('active', currentStep === i);
        if (currentStep === i) navEl.setAttribute('aria-current', 'step');
        else navEl.removeAttribute('aria-current');
      }

      const sumStepNum = totalRaces + 1;
      const sumNav = document.getElementById(`nav-${sumStepNum}`);
      if (sumNav) {
        if (currentStep === sumStepNum) sumNav.classList.add('active');
        else sumNav.classList.remove('active');
      }

      const counterEl = document.getElementById('answered-counter');
      if (counterEl) counterEl.textContent = `${answeredCount} / ${totalRaces}`;

      const mobCounter = document.getElementById('mobile-counter-badge');
      if (mobCounter) mobCounter.textContent = `${answeredCount} / ${totalRaces}`;
    }

    function goToStep(step) {
      if (!activeDistrictData) return;
      const totalRaces = activeDistrictData.races.length;
      const summaryStepNum = totalRaces + 1;

      document.querySelectorAll('.step-card').forEach(el => el.classList.remove('active'));
      currentStep = step;

      if (step === summaryStepNum) {
        showSummary();
      } else {
        const target = document.querySelector(`.step-card[data-step="${step}"]`);
        if (target) target.classList.add('active');
        updateProgress();
      }
      updateSidebarStatus();
      closeMobileSidebar();

      // Start each step at the top instead of wherever the last one was scrolled to.
      const main = document.querySelector('.main-content');
      if (main && main.getBoundingClientRect().top < 0) main.scrollIntoView({ block: 'start' });
    }

    function updateProgress() {
      if (currentStep === 0 || !activeDistrictData) return;
      const totalRaces = activeDistrictData.races.length;
      const pct = (currentStep / totalRaces) * 100;
      document.getElementById('progress-bar').style.width = pct + '%';
      document.getElementById('step-indicator').textContent = currentStep <= totalRaces ? `Step ${currentStep} of ${totalRaces}` : 'Final Step';
      
      const category = activeDistrictData.races[currentStep - 1] ? activeDistrictData.races[currentStep - 1].category : 'Summary';
      document.getElementById('step-category').textContent = category;
    }

    function selectCandidate(step, candIdx) {
      const cand = activeDistrictData.races[step - 1].candidates[candIdx];
      selections[step] = `${cand.name} (${cand.party})`;
      
      const stepElement = document.querySelector(`.step-card[data-step="${step}"]`);
      if (stepElement) {
        const cards = stepElement.querySelectorAll('.candidate-card');
        cards.forEach(card => {
          const isSelected = Number(card.dataset.candIndex) === candIdx;
          card.classList.toggle('selected', isSelected);
          card.setAttribute('aria-checked', String(isSelected));
        });
      }

      updateSidebarStatus();
    }

    function nextStep(step) {
      goToStep(step + 1);
    }

    function prevStep(step) {
      goToStep(step - 1);
    }

    function showSummary() {
      if (!activeDistrictData) return;
      const totalRaces = activeDistrictData.races.length;
      const summaryStepNum = totalRaces + 1;

      document.querySelectorAll('.step-card').forEach(el => el.classList.remove('active'));
      document.getElementById('summary-card').classList.add('active');
      currentStep = summaryStepNum;
      updateProgress();
      updateSidebarStatus();

      renderRecap();
    }

    // ---------- Voting Plan Recap ----------
    // All recap wording lives here as full sentences so it is easy to translate and reads well aloud.
    const ELECTION_DAY_ISO = '2026-11-03';

    const RECAP_TEXT = {
      badge: 'Your Voting Plan',
      title: (state) => `Your ${state} Ballot Recap`,
      location: (place, district) => `${place}. ${district}.`,
      daysLeftLabel: (n) => n === 1 ? 'day until Election Day' : 'days until Election Day',
      todayLabel: 'Election Day is today',
      allDone: (count, date) => `You made a choice in all ${count} races. Bring this plan with you, or keep it next to your mail ballot, and vote by ${date}.`,
      someDone: (done, count, date) => `You made a choice in ${done} of ${count} races. You can still go back and decide on the rest before you vote by ${date}. It is also fine to leave a race blank on your real ballot.`,
      noneDone: (count) => `You have not picked anyone yet in the ${count} races on this ballot. Use the Edit buttons below to go back and make your choices.`,
      choicesHeading: 'How you plan to vote',
      notDecided: 'Not decided yet',
      editButton: 'Edit',
      editAria: (race) => `Edit your choice for ${race}`,
      howHeading: 'How and where to vote',
      steps: [
        {
          title: 'Check your registration',
          body: (links) => `Make sure you are registered at your current address. Deadlines differ by state, and some states let you register on Election Day. ${links.state}`
        },
        {
          title: 'Voting by mail',
          body: () => 'If you have a mail ballot, read the instructions, sign the envelope, and return it by your state\'s deadline. Many places have secure drop boxes.'
        },
        {
          title: 'Find your polling place',
          body: (links) => `Your polling place and hours are set by your county or local election office. Look them up before you go. ${links.poll}`
        },
        {
          title: 'Know what to bring',
          body: (links) => `Some states ask for a photo ID and others do not. Check your state's rules before you go. ${links.id}`
        }
      ],
      linkState: 'Check your registration on Can I Vote.',
      linkPoll: 'Look up your polling place on Can I Vote.',
      linkId: 'See voter ID rules on Can I Vote.',
      disclaimer: 'This recap is a personal planning note, not an official ballot. Always follow the instructions on your official ballot and from your local election office.',
      copyButton: 'Copy my voting plan',
      copiedButton: 'Copied to clipboard',
      printButton: 'Print my voting plan',
      homeButton: 'Return to address search',
      copyHeader: (state, place) => `MY ${state.toUpperCase()} VOTING PLAN (${place})`,
      copyElectionDay: (date) => `Election Day: ${date}`,
      copyChecklist: 'Before you vote: check your registration, find your polling place, and check your state\'s ID rules at canivote.org.'
    };

    function escapeRecapHTML(str) {
      return String(str).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

    // Counts down to the guide's own election if it is still ahead, otherwise to the next general election.
    function getElectionDate() {
      const guideDate = activeDistrictData && activeDistrictData.election && activeDistrictData.election.date;
      const iso = guideDate && !isPastDate(guideDate) ? guideDate : ELECTION_DAY_ISO;
      const [y, m, d] = iso.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function formatRecapElectionDate() {
      const lang = document.documentElement.lang || 'en';
      return getElectionDate().toLocaleDateString(lang, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }

    function getDaysUntilElection() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      return Math.round((getElectionDate() - today) / 86400000);
    }

    // Official lookup tools from the National Association of Secretaries of State (canivote.org).
    function getVoterLinks() {
      const link = (path, label) => `<a href="https://www.nass.org/can-i-vote/${path}" target="_blank" rel="noopener">${escapeRecapHTML(label)}</a>`;
      return {
        state: link('voter-registration-status', RECAP_TEXT.linkState),
        poll: link('find-your-polling-place', RECAP_TEXT.linkPoll),
        id: link('valid-forms-id', RECAP_TEXT.linkId)
      };
    }

    // Looks up the chosen candidate object for a race, so the recap can show its party tag.
    function getSelectedCandidate(race, step) {
      const choice = selections[step];
      if (!choice) return null;
      return race.candidates.find(c => `${c.name} (${c.party})` === choice) || { name: choice, party: '', partyClass: '' };
    }

    function renderRecap() {
      const card = document.getElementById('summary-card');
      if (!card || !activeDistrictData) return;

      const races = activeDistrictData.races;
      const total = races.length;
      const done = races.filter((r, idx) => selections[idx + 1]).length;
      const dateText = formatRecapElectionDate();
      const daysLeft = getDaysUntilElection();

      let plainText;
      if (done === total) plainText = RECAP_TEXT.allDone(total, dateText);
      else if (done === 0) plainText = RECAP_TEXT.noneDone(total);
      else plainText = RECAP_TEXT.someDone(done, total, dateText);

      let countdownHTML = '';
      if (daysLeft === 0) {
        countdownHTML = `<div class="recap-countdown"><div class="recap-countdown-label">${RECAP_TEXT.todayLabel}</div></div>`;
      } else if (daysLeft > 0) {
        countdownHTML = `
          <div class="recap-countdown">
            <div class="recap-countdown-number">${daysLeft}</div>
            <div class="recap-countdown-label">${RECAP_TEXT.daysLeftLabel(daysLeft)}</div>
            <div class="recap-countdown-label">${escapeRecapHTML(dateText)}</div>
          </div>`;
      }

      // Group races by category, keeping ballot order.
      let lastCategory = null;
      const rowsHTML = races.map((race, idx) => {
        const step = idx + 1;
        const cand = getSelectedCandidate(race, step);
        let groupHTML = '';
        if (race.category !== lastCategory) {
          lastCategory = race.category;
          groupHTML = `<div class="recap-group-title">${escapeRecapHTML(race.category)}</div>`;
        }
        const choiceHTML = cand
          ? `<div class="recap-choice"><span>${escapeRecapHTML(cand.name)}</span>${cand.party ? `<span class="party-tag ${escapeRecapHTML(cand.partyClass)}">${escapeRecapHTML(cand.party)}</span>` : ''}</div>`
          : `<div class="recap-choice skipped">${RECAP_TEXT.notDecided}</div>`;
        return `
          ${groupHTML}
          <div class="recap-row">
            <div>
              <div class="recap-race-title">${escapeRecapHTML(race.title)}</div>
              ${choiceHTML}
            </div>
            <button class="recap-edit-btn" onclick="goToStep(${step})" aria-label="${escapeRecapHTML(RECAP_TEXT.editAria(race.title))}">${RECAP_TEXT.editButton}</button>
          </div>`;
      }).join('');

      const links = getVoterLinks();
      const stepsHTML = RECAP_TEXT.steps.map(st => `
        <li class="recap-step">
          <div class="recap-step-title"><span>${st.title}</span></div>
          <p>${st.body(links)}</p>
        </li>`).join('');

      card.innerHTML = `
        <div class="recap-hero">
          <div>
            <div class="race-type recap-badge">${RECAP_TEXT.badge}</div>
            <h2 class="race-title">${escapeRecapHTML(RECAP_TEXT.title(activeDistrictData.state))}</h2>
            <div class="recap-location">${escapeRecapHTML(RECAP_TEXT.location(activeDistrictData.locationName, activeDistrictData.districtText.replace(/\s*\|\s*/g, ', ')))}</div>
          </div>
          ${countdownHTML}
        </div>

        <p class="recap-plain ${done === total ? '' : 'incomplete'}" id="recap-plain-summary">${escapeRecapHTML(plainText)}</p>

        <h3 class="recap-section-title">${RECAP_TEXT.choicesHeading}</h3>
        <div class="summary-card">
          ${rowsHTML}
        </div>

        <h3 class="recap-section-title">${RECAP_TEXT.howHeading}</h3>
        <ul class="recap-steps">
          ${stepsHTML}
        </ul>

        <p class="recap-disclaimer">${RECAP_TEXT.disclaimer}</p>

        <div class="btn-group recap-actions">
          <button class="btn copy-btn" id="copy-btn" onclick="copyCheatSheet()"><span id="copy-btn-label">${RECAP_TEXT.copyButton}</span></button>
          <button class="btn btn-secondary" onclick="window.print()">${RECAP_TEXT.printButton}</button>
          <button class="back-home-btn" onclick="resetToAddressScreen()">${RECAP_TEXT.homeButton}</button>
        </div>
      `;
    }

    function copyCheatSheet() {
      if (!activeDistrictData) return;
      const line = `=====================================================\n`;
      let text = line;
      text += `    ${RECAP_TEXT.copyHeader(activeDistrictData.state, activeDistrictData.locationName)}\n`;
      text += `    ${RECAP_TEXT.copyElectionDay(formatRecapElectionDate())}\n`;
      text += line;

      let lastCategory = null;
      activeDistrictData.races.forEach((r, idx) => {
        if (r.category !== lastCategory) {
          lastCategory = r.category;
          text += `\n${r.category.toUpperCase()}\n`;
        }
        const choice = selections[idx + 1] || RECAP_TEXT.notDecided;
        text += `${idx + 1}. ${r.title}: ${choice}\n`;
      });

      text += `\n${RECAP_TEXT.copyChecklist}\n`;
      text += line;

      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('copy-btn');
        const label = document.getElementById('copy-btn-label');
        label.textContent = RECAP_TEXT.copiedButton;
        btn.classList.add('copied');
        setTimeout(() => {
          label.textContent = RECAP_TEXT.copyButton;
          btn.classList.remove('copied');
        }, 3000);
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('election-day-notice').innerHTML =
        `<strong>Election Day is ${escapeHTML(formatElectionDate(UPCOMING_ELECTION.date))}.</strong> ${OFFICIAL_LOOKUP_HTML}`;
      updateSidebarStatus();
    });
  </script>
  <script src="./js/a11y-i18n-strings.js"></script>
  <script src="./js/a11y.js"></script>
</body>
</html>
